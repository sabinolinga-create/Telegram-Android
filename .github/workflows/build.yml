
name: Build BryanChat Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout BryanChat
        uses: actions/checkout@v5

      - name: Download official TDLib
        uses: actions/checkout@v5
        with:
          repository: tdlib/td
          path: tdlib

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gperf php-cli perl make cmake ninja-build wget unzip zip

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q commandlinetools-linux-13114758_latest.zip -d /tmp/android
          mv /tmp/android/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "ndk;23.2.8568313" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Build OpenSSL
        run: |
          cd tdlib/example/android
          bash build-openssl.sh $HOME/android-sdk 23.2.8568313

      - name: Build TDLib for all Android architectures
        run: |
          cd tdlib/example/android
          bash build-tdlib.sh $HOME/android-sdk 23.2.8568313 "" "" "" 24 "arm64-v8a armeabi-v7a x86 x86_64"

      - name: Verify TDLib
        run: |
          test -d tdlib/example/android/tdlib/libs
          test -f tdlib/example/android/tdlib/java/org/drinkless/tdlib/Client.java
          find tdlib/example/android/tdlib/libs -name "libtdjni.so"

      - name: Integrate TDLib
        run: |
          mkdir -p app/src/main/jniLibs
          cp -a tdlib/example/android/tdlib/libs/. app/src/main/jniLibs/
          cp -a tdlib/example/android/tdlib/java/org app/src/main/java/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build BryanChat APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BryanChat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
